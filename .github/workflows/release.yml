name: Release

# Tag a version (git tag v1.0.0 && git push --tags) and the packaged .skill is attached to
# the GitHub release, so the README's "download the .skill" line is a real link.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tests/run_tests.py
      - run: python3 tools/package_skill.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.skill
          generate_release_notes: true
